<!DOCTYPE html>
<html>
<head>
    <title>Admin Page Debug</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .test-section { margin: 20px 0; padding: 20px; border: 1px solid #ccc; }
        .result { margin: 10px 0; padding: 10px; }
        .success { color: green; }
        .error { color: red; }
        img { max-width: 200px; margin: 10px; border: 1px solid #ddd; }
    </style>
</head>
<body>
    <h1>Admin Page Backend Connection Test</h1>
    
    <div class="test-section">
        <h2>1. Testing Backend API Connection</h2>
        <button onclick="testAPI()">Test API Connection</button>
        <div id="api-result" class="result"></div>
    </div>
    
    <div class="test-section">
        <h2>2. Testing Image Loading</h2>
        <div id="image-test" class="result"></div>
    </div>
    
    <div class="test-section">
        <h2>3. Admin Page URL</h2>
        <p>Current URL: <code>http://localhost:3000/admin</code></p>
        <p>Backend API: <code>http://localhost:8000/api/products/</code></p>
        <p>Frontend should load from backend and show unique images</p>
    </div>

    <script>
        async function testAPI() {
            const resultDiv = document.getElementById('api-result');
            resultDiv.innerHTML = 'Testing...';
            
            try {
                // Test the same API call that Admin.vue makes
                const response = await fetch('http://localhost:8000/api/products/');
                
                if (response.ok) {
                    const data = await response.json();
                    resultDiv.innerHTML = `<span class="success">✅ API Working! Loaded ${data.length} products</span>`;
                    
                    // Show first 5 products with images
                    const imageTestDiv = document.getElementById('image-test');
                    imageTestDiv.innerHTML = '<h3>First 5 Products:</h3>';
                    
                    data.slice(0, 5).forEach((product, index) => {
                        const imageUrl = product.image.startsWith('http') ? product.image : `http://localhost:8000${product.image}`;
                        imageTestDiv.innerHTML += `
                            <div class="result">
                                <p><strong>${product.title}</strong></p>
                                <p>Category: ${product.category?.name}</p>
                                <p>Image: ${product.image}</p>
                                <img src="${imageUrl}" onerror="this.src='/images/placeholder.jpg'">
                                <p>Full URL: ${imageUrl}</p>
                            </div>
                        `;
                    });
                } else {
                    resultDiv.innerHTML = `<span class="error">❌ API Error: ${response.status}</span>`;
                }
            } catch (error) {
                resultDiv.innerHTML = `<span class="error">❌ Connection Error: ${error.message}</span>`;
            }
        }
        
        // Auto-test on page load
        window.onload = function() {
            testAPI();
        };
    </script>
</body>
</html>
