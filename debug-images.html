<!DOCTYPE html>
<html>
<head>
    <title>Image Debug Test</title>
</head>
<body>
    <h1>Backend Image Test</h1>
    <h2>Testing API Response:</h2>
    <div id="api-results"></div>
    
    <h2>Testing Individual Images:</h2>
    <div id="image-test"></div>
    
    <script>
        // Test API directly
        fetch('http://localhost:8000/api/products/')
            .then(response => response.json())
            .then(data => {
                const resultsDiv = document.getElementById('api-results');
                resultsDiv.innerHTML = '<h3>First 5 Products from API:</h3>';
                data.slice(0, 5).forEach(product => {
                    resultsDiv.innerHTML += `
                        <p><strong>${product.title}</strong> -> ${product.image}</p>
                        <img src="${product.image}" style="width: 100px; height: 100px; object-fit: cover;" onerror="this.src='/images/placeholder.jpg'">
                        <hr>
                    `;
                });
            })
            .catch(error => {
                console.error('API Error:', error);
                document.getElementById('api-results').innerHTML = '<p style="color: red;">API Error: ' + error.message + '</p>';
            });
            
        // Test image URLs directly
        const testImages = [
            'http://localhost:8000/media/products/IMG-20240518-WA0004.jpg',
            'http://localhost:8000/media/products/l.jpg',
            'http://localhost:8000/media/products/iPhone-16-Pro-max-300x300.jpg',
            'http://localhost:8000/media/products/Computer.jpeg',
            'http://localhost:8000/media/products/t.jpg'
        ];
        
        const imageTestDiv = document.getElementById('image-test');
        imageTestDiv.innerHTML = '<h3>Direct Image Tests:</h3>';
        testImages.forEach((src, index) => {
            imageTestDiv.innerHTML += `
                <p><strong>Test ${index + 1}:</strong> ${src}</p>
                <img src="${src}" style="width: 100px; height: 100px; object-fit: cover; border: 1px solid #ccc;" onerror="this.src='/images/placeholder.jpg'">
                <hr>
            `;
        });
    </script>
</body>
</html>
